#Tank greebles
- type: entity
  parent: BaseGreeble
  id: GreebleWFSmallSphereTank
  name: external tank
  suffix: Small
  description: A spherical tank with a significant internal volume when under pressure.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 0,1
    sprite: _WF/Decorations/Greebles/32x32.rsi
    layers:
    - state: tanksmall

- type: entity
  parent: BaseGreeble
  id: GreebleWFSphereTank
  name: external tank
  description: A large, spherical tank with a vast internal volume when under pressure.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 0,1.5
    sprite: _WF/Decorations/Greebles/64x64.rsi
    layers:
    - state: tank

- type: entity
  parent: GreebleWFSphereTank
  id: GreebleWFSphereTankOx
  name: external tank
  suffix: Blue Oxy
  description: A large, spherical tank with a vast internal volume when under pressure. The blue stripes indicate it holds oxygen.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - state: tank-ox

- type: entity
  parent: GreebleWFSphereTank
  id: GreebleWFSphereTankNit
  name: external tank
  suffix: Red Nit
  description: A large, spherical tank with a vast internal volume when under pressure. The red stripes indicate it holds nitrogen. Or something very flammable. It's a 50/50 chance.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - state: tank-nit

# Radiator greebles

- type: entity
  parent: BaseGreeble
  id: GreebleRadiator-3
  name: radiator
  suffix: 3
  description: A large, glowing-hot radiator for irradiating excess heat from a space craft so the crew inside don't start frying.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 0,2
    sprite: _WF/Decorations/Greebles/32x96.rsi
    layers:
    - state: radiator1
  - type: PointLight
    enabled: true
    offset: 0,1.5
    radius: 3
    color: "#e3655c" # light red
